name: Compact OpenRouter settings

on:
  push:
    paths:
      - '.github/workflows/compact-openrouter-settings.yml'

permissions:
  contents: write

jobs:
  patch-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add mobile-safe OpenRouter panel CSS
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('styles.css')
          css = r'''
/* AETHER OpenRouter settings — mobile containment only */
#aetherOpenRouterSettings {
  box-sizing: border-box;
  width: 100%;
  max-width: 100%;
  min-width: 0;
  overflow: hidden;
}
#aetherOpenRouterSettings * {
  box-sizing: border-box;
  max-width: 100%;
}
#aetherOpenRouterSettings h3,
#aetherOpenRouterSettings p {
  overflow-wrap: anywhere;
  word-break: break-word;
}
#aetherOpenRouterSettings label {
  display: grid;
  gap: 7px;
  min-width: 0;
  margin-top: 12px;
}
#aetherOpenRouterSettings input,
#aetherOpenRouterSettings select {
  width: 100%;
  min-width: 0;
  max-width: 100%;
}
#aetherOpenRouterSettings .p4-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  min-width: 0;
  margin-top: 12px;
}
#aetherOpenRouterSettings .p4-actions button {
  min-width: 0;
  max-width: 100%;
  flex: 1 1 135px;
}
#aetherOpenRouterSettings .p4-result {
  min-width: 0;
  max-width: 100%;
  overflow-wrap: anywhere;
  word-break: break-word;
}
@media (max-width: 760px) {
  #aetherOpenRouterSettings {
    padding: 14px;
    border-radius: 14px;
  }
  #aetherOpenRouterSettings h3 {
    font-size: 15px;
    line-height: 1.25;
  }
  #aetherOpenRouterSettings > p {
    font-size: 10px;
    line-height: 1.55;
  }
  #aetherOpenRouterSettings .p4-actions button {
    flex: 1 1 100%;
  }
}
'''
          text = p.read_text()
          marker = '/* AETHER OpenRouter settings — mobile containment only */'
          if marker not in text:
              p.write_text(text.rstrip() + '\n' + css.strip() + '\n')
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/compact-openrouter-settings.yml
      - name: Commit UI-only patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add styles.css .github/workflows/compact-openrouter-settings.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Fix OpenRouter settings panel mobile containment'
          git push
