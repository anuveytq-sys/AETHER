name: Finalize AETHER Phase 7 Runtime Wiring
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Phase 7 sources
        run: |
          test -s phase7.js
          test -s phase7.css
          test -s build-phase7.js
          node --check phase7.js
          node --check build-phase7.js
      - name: Attach Phase 7 to the runtime bundle
        run: node build-phase7.js
      - name: Validate the resulting app bundle
        run: node --check app.js
      - name: Commit runtime wiring when needed
        run: |
          git config user.name 'AETHER Phase 7 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.js index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize AETHER Phase 7 runtime wiring'
          git push
