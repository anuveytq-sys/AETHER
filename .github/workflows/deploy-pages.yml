name: Deploy AETHER to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate-and-build:
    name: Validate Phase 1–9 and prepare site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js for syntax validation
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate required Phase 1–8 files
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html styles.css app.js vision.js phase4.js phase5.js phase7.js phase7.css phase8.js phase8-tracking.js phase8-screen-dwell.js phase8.css phase9.js phase9.css docs/PHASE-8.md docs/PHASE-9.md build-phase9.js build-phase7.js aether-ai.js api/aether.js README.md docs/PHASE-1.md docs/PHASE-2.md docs/PHASE-3.md docs/PHASE-4.md docs/PHASE-5.md; do
            test -s "$file" || { echo "::error::Required AETHER file missing or empty: $file"; exit 1; }
          done
          test -f .nojekyll || { echo "::error::Required marker file missing: .nojekyll"; exit 1; }
          grep -q 'styles.css' index.html
          grep -q 'app.js' index.html
          grep -q 'vision.js' index.html
          grep -q 'phase5.js' index.html
          grep -q 'phase8.css' index.html
          grep -q 'phase8.js' index.html
          grep -q 'phase8-tracking.js' index.html
          test -s phase9.js
          test -s phase9.css
          node --check phase9.js
          node --check build-phase9.js
          echo "Required Phase 1–8 files and AI backend source are present."

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Check Phase 3 JavaScript syntax
        run: node --check vision.js

      - name: Check Phase 4 JavaScript syntax
        run: node --check phase4.js

      - name: Check Phase 5 JavaScript syntax
        run: node --check phase5.js

      - name: Check Phase 7 JavaScript syntax
        run: node --check phase7.js

      - name: Check Phase 8 Access syntax
        run: node --check phase8.js

      - name: Check COSMOSIM-style Access tracking syntax
        run: node --check phase8-tracking.js

      - name: Check whole-screen edge dwell syntax
        run: node --check phase8-screen-dwell.js

      - name: Check Phase 7 build attachment syntax
        run: node --check build-phase7.js

      - name: Check AETHER AI bridge syntax
        run: node --check aether-ai.js

      - name: Check AETHER backend syntax
        run: node --check api/aether.js

      - name: Attach whole-screen edge dwell to the Pages build copy
        shell: bash
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');const p='index.html';let s=fs.readFileSync(p,'utf8');const tag='<script src=\"phase8-tracking.js\" defer></script>';if(!s.includes(tag))throw new Error('phase8-tracking.js script tag not found');if(!s.includes('phase8-screen-dwell.js'))s=s.replace(tag,tag+'<script src=\"phase8-screen-dwell.js\" defer></script>');fs.writeFileSync(p,s);"
          grep -q 'phase8-screen-dwell.js' index.html
          echo "Whole-screen edge dwell was attached only to the Pages build copy."

      - name: Attach Phase 4 and AI intelligence to the existing app bundle for Pages
        shell: bash
        run: |
          set -euo pipefail
          printf '\n/* AETHER PHASE 4 BUILD ATTACHMENT */\n' >> app.js
          cat phase4.js >> app.js
          printf '\n/* AETHER OPENROUTER INTELLIGENCE BUILD ATTACHMENT */\n' >> app.js
          cat aether-ai.js >> app.js
          node --check app.js
          echo "Phase 4 and the OpenRouter AI bridge were appended only to the Pages build copy of app.js."

      - name: Contain OpenRouter settings panel on mobile
        shell: bash
        run: |
          set -euo pipefail
          cat >> styles.css <<'CSS'
          /* AETHER OpenRouter settings — mobile containment only */
          #aetherOpenRouterSettings {
            box-sizing: border-box;
            width: 100%;
            max-width: 100%;
            min-width: 0;
            overflow: hidden;
          }
          #aetherOpenRouterSettings * {
            box-sizing: border-box;
            max-width: 100%;
          }
          #aetherOpenRouterSettings h3,
          #aetherOpenRouterSettings p {
            overflow-wrap: anywhere;
            word-break: break-word;
          }
          #aetherOpenRouterSettings label {
            display: grid;
            gap: 7px;
            min-width: 0;
            margin-top: 12px;
          }
          #aetherOpenRouterSettings input,
          #aetherOpenRouterSettings select {
            width: 100%;
            min-width: 0;
            max-width: 100%;
          }
          #aetherOpenRouterSettings .p4-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-width: 0;
            margin-top: 12px;
          }
          #aetherOpenRouterSettings .p4-actions button {
            min-width: 0;
            max-width: 100%;
            flex: 1 1 135px;
          }
          #aetherOpenRouterSettings .p4-result {
            min-width: 0;
            max-width: 100%;
            overflow-wrap: anywhere;
            word-break: break-word;
          }
          @media (max-width: 760px) {
            #aetherOpenRouterSettings {
              padding: 14px;
              border-radius: 14px;
            }
            #aetherOpenRouterSettings h3 {
              font-size: 15px;
              line-height: 1.25;
            }
            #aetherOpenRouterSettings > p {
              font-size: 10px;
              line-height: 1.55;
            }
            #aetherOpenRouterSettings .p4-actions button {
              flex: 1 1 100%;
            }
          }
          CSS
          echo "OpenRouter settings panel containment CSS added only to the Pages build copy."

      - name: Attach Phase 7 NEXUS to the Pages build copy
        shell: bash
        run: |
          set -euo pipefail
          node build-phase7.js
          grep -q 'phase7.css' index.html
          grep -q 'phase7.js' index.html
          node --check app.js
          echo "Phase 7 NEXUS was attached only to the Pages build copy."

      - name: Attach Phase 9 to the Pages build copy
        run: node build-phase9.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    name: Deploy AETHER
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate-and-build
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
