name: Deploy AETHER to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate-and-build:
    name: Validate Phase 1–4 and prepare site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js for syntax validation
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate required Phase 1–4 files
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html styles.css app.js vision.js phase4.js aether-ai.js api/aether.js README.md docs/PHASE-1.md docs/PHASE-2.md docs/PHASE-3.md docs/PHASE-4.md; do
            test -s "$file" || { echo "::error::Required AETHER file missing or empty: $file"; exit 1; }
          done
          test -f .nojekyll || { echo "::error::Required marker file missing: .nojekyll"; exit 1; }
          grep -q 'styles.css' index.html
          grep -q 'app.js' index.html
          grep -q 'vision.js' index.html
          echo "Required Phase 1–4 files and AI backend source are present."

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Check Phase 3 JavaScript syntax
        run: node --check vision.js

      - name: Check Phase 4 JavaScript syntax
        run: node --check phase4.js

      - name: Check AETHER AI bridge syntax
        run: node --check aether-ai.js

      - name: Check AETHER backend syntax
        run: node --check api/aether.js

      - name: Attach Phase 4 and AI intelligence to the existing app bundle for Pages
        shell: bash
        run: |
          set -euo pipefail
          printf '\n/* AETHER PHASE 4 BUILD ATTACHMENT */\n' >> app.js
          cat phase4.js >> app.js
          printf '\n/* AETHER OPENROUTER INTELLIGENCE BUILD ATTACHMENT */\n' >> app.js
          cat aether-ai.js >> app.js
          node --check app.js
          echo "Phase 4 and the OpenRouter AI bridge were appended only to the Pages build copy of app.js."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    name: Deploy AETHER
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate-and-build
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
