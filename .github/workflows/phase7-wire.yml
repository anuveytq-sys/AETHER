name: Wire AETHER Phase 7
on:
  push:
    branches: [feature/phase7-nexus]
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire Phase 7 into index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'phase7.css' not in s:
              s=s.replace('</head>','<link rel="stylesheet" href="phase7.css"></head>')
          if 'phase7.js' not in s:
              s=s.replace('</body>','<script src="phase7.js" defer></script></body>')
          p.write_text(s)
          PY
      - name: Commit wiring
        run: |
          git config user.name 'AETHER Phase 7 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Wire AETHER Phase 7 into the main workspace'
          git push
